# ============================================================
# ML WAF - Puntuación Personalizada (independiente de CRS)
# Basado en regresión logística con Lasso (|peso| > 0.5)
# ============================================================

SecRuleEngine On
SecRequestBodyAccess On

# 1. INICIALIZACIÓN (fase 1)
SecAction "id:1001000, phase:1, pass, nolog, setvar:tx.ml_score=0"

# ============================================================
# 3. REGLAS DE DETECCIÓN (pesos > 0.5)
# ============================================================

# 931131 (+5) - protocolos URL peligrosos
SecRule REQUEST_FILENAME "@rx (?i)(?:(?:url|jar):)?(?:a(?:cap|f[ps]|ttachment)|b(?:eshare|itcoin|lob)|c(?:a(?:llto|p)|id|vs|ompress.(?:zlib|bzip2))|d(?:a(?:v|ta)|ict|n(?:s|tp))|e(?:d2k|xpect)|f(?:(?:ee)?d|i(?:le|nger|sh)|tps?)|g(?:it|o(?:pher)?|lob)|h(?:323|ttps?)|i(?:ax|cap|(?:ma|p)ps?|rc[6s]?)|ja(?:bbe)?r|l(?:dap[is]?|ocal_file)|m(?:a(?:ilto|ven)|ms|umble)|n(?:e(?:tdoc|ws)|fs|ntps?)|ogg|p(?:aparazzi|h(?:ar|p)|op(?:2|3s?)|r(?:es|oxy)|syc)|r(?:mi|sync|tm(?:f?p)?|ar)|s(?:3|ftp|ips?|m(?:[bs]|tps?)|n(?:ews|mp)|sh(?:2(?:.(?:s(?:hell|(?:ft|c)p)|exec|tunnel))?)?|vn(?:\+ssh)?)|t(?:e(?:amspeak|lnet)|ftp|urns?)|u(?:dp|nreal|t2004)|v(?:entrilo|iew-source|nc)|w(?:ebcal|ss?)|x(?:mpp|ri)|zip)://(?:[^@]+@)?([^/]*)" \
    "id:1001001, phase:2, pass, log, msg:'ML: 931131 (+5)', \
     setvar:tx.ml_score_tmp=+5, setvar:tx.ml_score=+%{tx.ml_score_tmp}"

# 930130 (+4) - archivos restringidos
SecRule REQUEST_FILENAME \
"@pmFromFile /home/vagrant/go/pkg/mod/github.com/corazawaf/coraza-coreruleset/v4@v4.20.0/rules/@owasp_crs/restricted-files.data" \
    "id:1001002, phase:2, pass, log, msg:'ML: 930130 (+4)', \
